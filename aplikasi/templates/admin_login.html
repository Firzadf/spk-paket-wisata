{% extends "base.html" %}
{% block title %}Login Admin — TripRank{% endblock %}
{% block content %}
<div class="login-wrap">
<div class="page-head">
  <figure class="logo-3d"><img src="{{ url_for('static', filename='images/logo-3d.png') }}" width="120" height="80" alt="Logo 3D TripRank, pin hijau bergaya clay dengan huruf T dan grafik ranking"></figure>
  <h1>Masuk Admin</h1>
  <p class="lede">Halaman ini hanya untuk pengelola. Pengunjung biasa tidak perlu masuk.</p>
</div>
<div class="login-box">
  <h2>Login Admin</h2>
  <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="field">
      <label for="username">Nama pengguna</label>
      <input id="username" name="username" required autocomplete="username">
    </p>
    <p class="field">
      <label for="password">Kata sandi</label>
      <input id="password" type="password" name="password" required autocomplete="current-password">
    </p>
    <p><button type="submit">Masuk</button></p>
  </form>
  <p class="hint">Akun demo: admin / admin123. Ganti sebelum pemakaian nyata.</p>
</div>
</div>
{% endblock %}
